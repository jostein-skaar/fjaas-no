<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.svg" />
    <title>FjaaS</title>
    <style>
      html {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        background-image: linear-gradient(to top, #6dff6d, #e6d200, #ff8c24, #ff2690, #ff44ff);
        background-color: #ff44ff;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 10px;
        color: #fff;
        font-size: 20px;
        min-height: 100vh;
        box-sizing: border-box;
      }

      h1 {
        margin: 0;
        padding-top: 50px;
        padding-bottom: 5px;
        text-align: center;
      }

      p {
        padding-top: 15px;
        padding-bottom: 15px;
        text-align: center;
      }

      a {
        color: inherit;
      }

      .games {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
        gap: 24px;
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 6px;
      }

      .game {
        display: flex;
        flex-direction: column;
        background-color: rgba(30, 0, 40, 0.55);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      }

      .game-image {
        display: block;
        aspect-ratio: 4 / 3;
        background-color: rgba(0, 0, 0, 0.15);
      }

      .game-image img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.2s ease;
      }

      .game-image:hover img {
        transform: scale(1.03);
      }

      .game-content {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 16px 20px 20px;
      }

      .game h2 {
        margin: 0;
        font-size: 1.3em;
      }

      .game p {
        margin: 0;
        padding: 8px 0 0;
        text-align: left;
        font-size: 0.85em;
        line-height: 1.4;
      }

      .game .game-date {
        padding-top: 2px;
        font-size: 0.75em;
        opacity: 0.85;
      }

      .game-links {
        display: flex;
        gap: 10px;
        margin-top: auto;
        padding-top: 16px;
      }

      .button {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border: 2px solid #fff;
        border-radius: 999px;
        background-color: #fff;
        color: #ff2690;
        font-weight: bold;
        font-size: 0.85em;
        text-align: center;
        text-decoration: none;
      }

      .button:hover {
        background-color: #ffe9f4;
      }

      .button-secondary {
        background-color: transparent;
        color: #fff;
      }

      .button-secondary:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }

      .js .game {
        opacity: 0;
        transform: translateY(-80px) rotate(-4deg);
        transition:
          opacity 0.4s ease-out,
          transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .js .game:nth-child(even) {
        transform: translateY(-80px) rotate(4deg);
      }

      .js .game.visible {
        opacity: 1;
        transform: none;
      }

      /* Bunnen av gradienten er lysegrønn, så footeren har mørk tekst i stedet for hvit. */
      footer {
        padding: 20px 10px 40px;
        color: rgba(30, 0, 40, 0.75);
        font-size: 0.75em;
        text-align: center;
      }

      /* JEDB i footeren: hover (mus) eller klikk/trykk (fokus) viser forklaringen. */
      abbr[data-tip] {
        position: relative;
        text-decoration: underline dotted;
        cursor: pointer;
      }

      abbr[data-tip]:focus {
        outline: none;
      }

      abbr[data-tip]::after {
        content: attr(data-tip);
        display: none;
        position: absolute;
        bottom: 1.6em;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        padding: 5px 10px;
        border-radius: 8px;
        background-color: rgba(30, 0, 40, 0.85);
        color: #fff;
      }

      abbr[data-tip]:focus::after {
        display: block;
      }

      @media (hover: hover) {
        abbr[data-tip]:hover::after {
          display: block;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .js .game,
        .js .game:nth-child(even) {
          opacity: 1;
          transform: none;
          transition: none;
        }
      }
    </style>
    <script>
      document.documentElement.classList.add('js');
    </script>
  </head>

  <body>
    <h1>FjaaS as a Service</h1>
    <p>"Jeg elsker rekursive akronymer." - <a href="https://www.josteinskaar.no/">Jostein</a></p>

    <main class="games">
      <!-- GAMES -->
    </main>

    <footer>Generert fra <abbr tabindex="0" data-tip="Jostein's Everything Database">JEDB</abbr> · <!-- YEAR --></footer>

    <script>
      const observer = new IntersectionObserver(
        (entries) => {
          entries
            .filter((entry) => entry.isIntersecting)
            .forEach((entry, i) => {
              entry.target.style.transitionDelay = `${i * 120}ms`;
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            });
        },
        { threshold: 0.15 },
      );

      document.querySelectorAll('.game').forEach((game) => observer.observe(game));
    </script>
  </body>
</html>
